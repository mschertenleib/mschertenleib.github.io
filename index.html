<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Mathieu Schertenleib</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@100;300;400;700&display=swap" />
  <style>
    body {
      font-family: Roboto, Arial, Helvetica, sans-serif;
      line-height: 1.3;
      margin: 2rem 2rem;
      color: #333;
      background-color: #fff;
    }

    body a {
      text-decoration: none;
      color: cadetblue;
    }

    body a:hover {
      text-decoration: underline;
      opacity: 0.7;
    }

    body h2 {
      font-weight: lighter;
      font-size: 1.5rem;
      color: #666;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 2rem;
      padding: 0 1rem;
      color: #666;
    }

    header h1 {
      font-weight: lighter;
      font-size: 2rem;
    }

    .icons {
      display: flex;
      gap: 1.5rem;
      line-height: 0;
    }

    .icon-github {
      color: #181717;
    }

    .grid {
      display: grid;
      gap: 1rem;
      grid-template-columns: repeat(auto-fit, minmax(400px, 1fr));
    }

    .project {
      display: flex;
      flex-direction: column;
      padding: 1rem;
      border-radius: 8px;
      border: 1px solid #ccc;
    }

    .image {
      flex: 0 0 auto;
      width: 100%;
      height: 12rem;
      object-fit: contain;
      object-position: center;
    }

    .title {
      flex: 0 0 auto;
      margin: 1rem 0;
    }

    .description {
      flex: 1 1 auto;
      margin: 0 0 1rem 0;
    }

    .context {
      flex: 0 0 auto;
      margin: 0 0 1rem 0;
      color: #888;
    }

    .bottom-container {
      display: flex;
      flex-direction: row;
      justify-content: space-between;
    }

    .date {
      flex: 0 0 auto;
      color: #888;
    }

    .links {
      flex: 0 0 auto;
      display: flex;
      flex-direction: row;
      justify-content: flex-end;
      gap: 2rem;
    }

    @media (prefers-color-scheme: dark) {
      body {
        background-color: #181818;
        color: #ddd;
      }

      body h2 {
        color: #999;
      }

      header {
        color: #999;
      }

      .icon-github {
        color: #fff;
      }

      .project {
        border-color: #333;
      }

      .context {
        color: #777;
      }

      .date {
        color: #777;
      }
    }
  </style>
</head>

  <script>
    (function () {
      const template = document.getElementById('project-template');
      const target = document.getElementById('projects');
      const projectsData = document.getElementById('projects-data').textContent.trim();
      let projects = [];
      try {
        projects = JSON.parse(projectsData);
      } catch (e) {
        console.error('Invalid projects JSON', e);
      }

      const fragment = document.createDocumentFragment();
      projects.forEach(p => {
        const node = template.content.cloneNode(true);
        const image = node.querySelector('.image');
        const title = node.querySelector('.title');
        const description = node.querySelector('.description');
        const context = node.querySelector('.context');
        const date = node.querySelector('.date');
        const links = node.querySelector('.links');

        image.src = p.image || '';
        image.alt = p.title ? p.title + ' image' : '';
        title.textContent = p.title || '';
        description.textContent = p.description || '';
        date.textContent = p.date || '';

        if (p.context === 'personal') {
          context.appendChild(document.createTextNode('Developed out of personal interest'));
        } else if (p.context === 'course' && p.course) {
          context.appendChild(document.createTextNode('Developed for the EPFL course '));
          const courseEl = document.createElement('i');
          courseEl.textContent = p.course;
          context.appendChild(courseEl);
        } else if (p.context === 'semester') {
          context.appendChild(document.createTextNode('Developed as an EPFL robotics semester project'));
        }

        if (p.lab) {
          context.appendChild(document.createTextNode(', conducted in the lab '));
          const labEl = document.createElement('i');
          labEl.textContent = p.lab;
          context.appendChild(labEl);
        } else if (p.association) {
          context.appendChild(document.createTextNode(', conducted in the student-led association '));
          const associationEl = document.createElement('i');
          associationEl.textContent = p.association;
          context.appendChild(associationEl);
        }

        if (Array.isArray(p.collaborators) && p.collaborators.length > 0) {
          const names = p.collaborators.length === 1
            ? p.collaborators[0]
            : `${p.collaborators.slice(0, -1).join(', ')} and ${p.collaborators[p.collaborators.length - 1]}`;
          context.appendChild(document.createTextNode(`, with ${names}`));
        }

        const linkElements = [];
        const linkNames = {
          repository: 'GitHub',
          video: 'Video',
          website: 'Website'
        };
        Object.entries(linkNames).forEach(([prop, name]) => {
          const href = p[prop];
          if (!href) return;
          const a = document.createElement('a');
          a.href = href;
          a.target = '_blank';
          a.rel = 'noopener';
          a.textContent = name;
          linkElements.push(a);
        });
        if (linkElements.length) {
          links.append(...linkElements);
        }

        fragment.appendChild(node);
      });

      target.appendChild(fragment);
    })();
  </script>
